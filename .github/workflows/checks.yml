name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: root
            directory: .
          - module: ui
            directory: ui
          - module: tools
            directory: tools
          - module: qBittorrent client
            directory: clients/qbittorrent
          - module: NZBGet client
            directory: clients/nzbget
          - module: Sonarr client
            directory: clients/sonarr
          - module: Radarr client
            directory: clients/radarr
          - module: Jellyfin client
            directory: clients/jellyfin
          - module: Seerr client
            directory: clients/seerr
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: |
            go.sum
            ui/go.sum
            tools/go.sum
            clients/qbittorrent/go.sum
            clients/nzbget/go.sum
            clients/sonarr/go.sum
            clients/radarr/go.sum
            clients/jellyfin/go.sum
            clients/seerr/go.sum

      - name: Download modules
        env:
          GOWORK: off
        run: go mod download

      - name: Verify modules
        env:
          GOWORK: off
        run: go mod verify

      - name: Test
        env:
          GOWORK: off
        run: |
          packages=$(go list ./...)
          if [ -z "$packages" ]; then
            echo "module has no discoverable packages" >&2
            exit 1
          fi
          go test $packages

      - name: Race test
        env:
          GOWORK: off
        run: |
          packages=$(go list ./...)
          if [ -z "$packages" ]; then
            echo "module has no discoverable packages" >&2
            exit 1
          fi
          go test -race $packages

      - name: Vet
        env:
          GOWORK: off
        run: |
          packages=$(go list ./...)
          if [ -z "$packages" ]; then
            echo "module has no discoverable packages" >&2
            exit 1
          fi
          go vet $packages

  generation:
    name: Reproducible generation
    runs-on: ubuntu-latest
    needs: go
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: |
            go.sum
            ui/go.sum
            tools/go.sum
            clients/qbittorrent/go.sum
            clients/nzbget/go.sum
            clients/sonarr/go.sum
            clients/radarr/go.sum
            clients/jellyfin/go.sum
            clients/seerr/go.sum

      - name: Check generated artifacts
        env:
          GOWORK: off
        run: |
          (cd tools && go mod download)
          ./scripts/check-guardrails.sh --generation
          (cd clients/qbittorrent && ./check-generation.sh)
          for directory in clients/nzbget clients/sonarr clients/radarr clients/jellyfin clients/seerr; do
            (cd "$directory" && GOPROXY=off GOSUMDB=off ./check-generation.sh)
          done

      - name: Check for changes
        run: git diff --exit-code

  api:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: |
            go.sum
            ui/go.sum
            tools/go.sum
            clients/qbittorrent/go.sum
            clients/nzbget/go.sum
            clients/sonarr/go.sum
            clients/radarr/go.sum
            clients/jellyfin/go.sum
            clients/seerr/go.sum

      - name: Download modules
        env:
          GOWORK: off
        run: |
          for directory in . ui tools clients/qbittorrent clients/nzbget clients/sonarr clients/radarr clients/jellyfin clients/seerr; do
            (cd "$directory" && go mod download)
          done

      - name: Validate bundled contract and generated clients
        env:
          GOWORK: off
        run: ./scripts/check-guardrails.sh --fast

  lint:
    name: Go lint and architecture
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: |
            go.sum
            ui/go.sum
            tools/go.sum
            clients/qbittorrent/go.sum
            clients/nzbget/go.sum
            clients/sonarr/go.sum
            clients/radarr/go.sum
            clients/jellyfin/go.sum
            clients/seerr/go.sum

      - name: Download modules
        env:
          GOWORK: off
        run: |
          for directory in . ui tools clients/qbittorrent clients/nzbget clients/sonarr clients/radarr clients/jellyfin clients/seerr; do
            (cd "$directory" && go mod download)
          done

      - name: Run pinned lint and import checks
        env:
          GOWORK: off
        run: ./scripts/check-lint.sh

  guardrails:
    name: Guardrail aggregate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: |
            go.sum
            ui/go.sum
            tools/go.sum
            clients/qbittorrent/go.sum
            clients/nzbget/go.sum
            clients/sonarr/go.sum
            clients/radarr/go.sum
            clients/jellyfin/go.sum
            clients/seerr/go.sum

      - name: Download modules
        env:
          GOWORK: off
        run: |
          for directory in . ui tools clients/qbittorrent clients/nzbget clients/sonarr clients/radarr clients/jellyfin clients/seerr; do
            (cd "$directory" && go mod download)
          done

      - name: Run full guardrail suite
        env:
          GOWORK: off
        run: ./scripts/check-guardrails.sh --ci

  cross-build:
    name: Linux CGO-free (${{ matrix.module }}, ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: root
            directory: .
            arch: amd64
          - module: root
            directory: .
            arch: arm64
          - module: ui
            directory: ui
            arch: amd64
          - module: ui
            directory: ui
            arch: arm64
          - module: tools
            directory: tools
            arch: amd64
          - module: tools
            directory: tools
            arch: arm64
          - module: qBittorrent client
            directory: clients/qbittorrent
            arch: amd64
          - module: qBittorrent client
            directory: clients/qbittorrent
            arch: arm64
          - module: NZBGet client
            directory: clients/nzbget
            arch: amd64
          - module: NZBGet client
            directory: clients/nzbget
            arch: arm64
          - module: Sonarr client
            directory: clients/sonarr
            arch: amd64
          - module: Sonarr client
            directory: clients/sonarr
            arch: arm64
          - module: Radarr client
            directory: clients/radarr
            arch: amd64
          - module: Radarr client
            directory: clients/radarr
            arch: arm64
          - module: Jellyfin client
            directory: clients/jellyfin
            arch: amd64
          - module: Jellyfin client
            directory: clients/jellyfin
            arch: arm64
          - module: Seerr client
            directory: clients/seerr
            arch: amd64
          - module: Seerr client
            directory: clients/seerr
            arch: arm64
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: |
            go.sum
            ui/go.sum
            tools/go.sum
            clients/qbittorrent/go.sum
            clients/nzbget/go.sum
            clients/sonarr/go.sum
            clients/radarr/go.sum
            clients/jellyfin/go.sum
            clients/seerr/go.sum

      - name: Download modules
        env:
          GOWORK: off
        run: go mod download

      - name: Build Linux CGO-free
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GOWORK: off
        run: go build -mod=readonly ./...
