name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: root
            directory: .
          - module: ui
            directory: ui
          - module: tools
            directory: tools
          - module: qBittorrent client
            directory: clients/qbittorrent
          - module: NZBGet client
            directory: clients/nzbget
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: |
            go.sum
            ui/go.sum
            tools/go.sum
            clients/qbittorrent/go.sum
            clients/nzbget/go.sum

      - name: Download modules
        env:
          GOWORK: off
        run: go mod download

      - name: Verify modules
        env:
          GOWORK: off
        run: go mod verify

      - name: Test
        env:
          GOWORK: off
        run: |
          packages=$(go list ./...)
          if [ -z "$packages" ]; then
            echo "module has no discoverable packages" >&2
            exit 1
          fi
          go test $packages

      - name: Vet
        env:
          GOWORK: off
        run: |
          packages=$(go list ./...)
          if [ -z "$packages" ]; then
            echo "module has no discoverable packages" >&2
            exit 1
          fi
          go vet $packages

  generation:
    name: Reproducible generation
    runs-on: ubuntu-latest
    needs: go
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: |
            go.sum
            ui/go.sum
            tools/go.sum
            clients/qbittorrent/go.sum
            clients/nzbget/go.sum

      - name: Check generated artifacts
        env:
          GOWORK: off
        run: |
          (cd tools && go mod download)
          ./scripts/generate.sh --check

      - name: Check for changes
        run: git diff --exit-code

  api:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: |
            go.sum
            ui/go.sum
            tools/go.sum
            clients/qbittorrent/go.sum
            clients/nzbget/go.sum

      - name: Download modules
        env:
          GOWORK: off
        run: |
          for directory in . ui tools clients/qbittorrent clients/nzbget; do
            (cd "$directory" && go mod download)
          done

      - name: Validate bundled contract and generated clients
        env:
          GOWORK: off
        run: ./scripts/check-api.sh

  lint:
    name: Go lint and architecture
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: |
            go.sum
            ui/go.sum
            tools/go.sum
            clients/qbittorrent/go.sum
            clients/nzbget/go.sum

      - name: Download modules
        env:
          GOWORK: off
        run: |
          for directory in . ui tools clients/qbittorrent clients/nzbget; do
            (cd "$directory" && go mod download)
          done

      - name: Run pinned lint and import checks
        env:
          GOWORK: off
        run: ./scripts/check-lint.sh

  guardrails:
    name: Guardrail aggregate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: |
            go.sum
            ui/go.sum
            tools/go.sum
            clients/qbittorrent/go.sum
            clients/nzbget/go.sum

      - name: Download modules
        env:
          GOWORK: off
        run: |
          for directory in . ui tools clients/qbittorrent clients/nzbget; do
            (cd "$directory" && go mod download)
          done

      - name: Run full guardrail suite
        env:
          GOWORK: off
        run: ./scripts/check-guardrails.sh --ci
