---
paths:
  "/api/v1/workflow-runs/{workflowRunId}":
    parameters:
    - "$ref": "#/components/parameters/WorkflowRunId"
    get:
      operationId: getWorkflowRun
      tags:
      - execution
      responses:
        '200':
          description: Workflow progress and step state.
          headers:
            Cache-Control:
              "$ref": "#/components/headers/Cache-Control"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WorkflowRun"
        '404':
          "$ref": "#/components/responses/Problem404"
