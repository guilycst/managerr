---
paths:
  "/api/v1/scans/{scanId}":
    parameters:
    - "$ref": "#/components/parameters/ScanId"
    get:
      operationId: getScan
      tags:
      - observations
      responses:
        '200':
          description: Scan progress and coverage.
          headers:
            Cache-Control:
              "$ref": "#/components/headers/Cache-Control"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Scan"
        '404':
          "$ref": "#/components/responses/Problem404"
