---
paths:
  "/api/v1/storage-roots/{storageRootId}":
    parameters:
    - "$ref": "#/components/parameters/StorageRootId"
    get:
      operationId: getStorageRoot
      tags:
      - configuration
      responses:
        '200':
          description: Storage root.
          headers:
            Cache-Control:
              "$ref": "#/components/headers/Cache-Control"
            ETag:
              "$ref": "#/components/headers/ETag"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StorageRoot"
        '404':
          "$ref": "#/components/responses/Problem404"
    patch:
      operationId: patchStorageRoot
      tags:
      - configuration
      parameters:
      - "$ref": "#/components/parameters/IfMatch"
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/StorageRootPatch"
      responses:
        '200':
          description: Updated storage root.
          headers:
            Cache-Control:
              "$ref": "#/components/headers/Cache-Control"
            ETag:
              "$ref": "#/components/headers/ETag"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StorageRoot"
        '400':
          "$ref": "#/components/responses/Problem400"
        '404':
          "$ref": "#/components/responses/Problem404"
        '409':
          "$ref": "#/components/responses/Problem409"
        '412':
          "$ref": "#/components/responses/Problem412"
        '428':
          "$ref": "#/components/responses/Problem428"
    delete:
      operationId: retireStorageRoot
      tags:
      - configuration
      parameters:
      - "$ref": "#/components/parameters/IfMatch"
      - "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        '204':
          description: Storage root retired.
        '404':
          "$ref": "#/components/responses/Problem404"
        '409':
          "$ref": "#/components/responses/Problem409"
        '412':
          "$ref": "#/components/responses/Problem412"
        '428':
          "$ref": "#/components/responses/Problem428"
