---
paths:
  "/api/v1/scans":
    get:
      operationId: listScans
      tags:
      - observations
      parameters:
      - "$ref": "#/components/parameters/Cursor"
      - "$ref": "#/components/parameters/Limit"
      responses:
        '200':
          description: Scan jobs.
          headers:
            Cache-Control:
              "$ref": "#/components/headers/Cache-Control"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ScanList"
        '409':
          "$ref": "#/components/responses/ProblemSnapshotExpired"
    post:
      operationId: createScan
      tags:
      - observations
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ScanCreate"
      responses:
        '202':
          description: Scan queued or coalesced.
          headers:
            Cache-Control:
              "$ref": "#/components/headers/Cache-Control"
            Location:
              "$ref": "#/components/headers/Location"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AsyncAccepted"
        '400':
          "$ref": "#/components/responses/Problem400"
        '409':
          "$ref": "#/components/responses/Problem409"
        '429':
          "$ref": "#/components/responses/Problem429"
