---
components:
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/ConfigId"
    ConnectionCheckId:
      name: connectionCheckId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Id"
    StorageRootId:
      name: storageRootId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/ConfigId"
    PathMappingId:
      name: pathMappingId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/ConfigId"
    ScanId:
      name: scanId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Id"
    DiscoveryId:
      name: discoveryId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Id"
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Id"
    DownloadId:
      name: downloadId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Id"
    ActionPlanId:
      name: actionPlanId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Id"
    ReviewDecisionId:
      name: reviewDecisionId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Id"
    ActionRunId:
      name: actionRunId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Id"
    WorkflowRunId:
      name: workflowRunId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Id"
    TrashId:
      name: trashId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Id"
    DescriptorId:
      name: descriptorId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Id"
    RootFilter:
      name: rootId
      in: query
      required: false
      schema:
        "$ref": "#/components/schemas/ConfigId"
    MediaKindFilter:
      name: kind
      in: query
      required: false
      schema:
        "$ref": "#/components/schemas/MediaKind"
    ConnectionFilter:
      name: connectionId
      in: query
      required: false
      schema:
        "$ref": "#/components/schemas/ConfigId"
