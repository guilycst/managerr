---
components:
  schemas:
    Id:
      "$ref": "#/components/schemas/RuntimeId"
    RuntimeId:
      type: string
      format: uuid
    ConfigId:
      type: string
      minLength: 1
      maxLength: 63
      pattern: "^[a-z0-9](?:[a-z0-9._-]*[a-z0-9])?$"
    Timestamp:
      type: string
      format: date-time
    NullableTimestamp:
      type: string
      format: date-time
      nullable: true
    MediaKind:
      type: string
      enum:
      - movie
      - episode
      - season
      - anime
    Health:
      type: object
      additionalProperties: false
      required:
      - status
      - observedAt
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          - not_ready
        observedAt:
          "$ref": "#/components/schemas/Timestamp"
        reason:
          type: string
    SourceMetadata:
      type: object
      additionalProperties: false
      required:
      - source
      - editable
      - documentId
      - revision
      - startupAt
      - reloadPolicy
      properties:
        source:
          type: string
          enum:
          - yaml
          - api
        editable:
          type: boolean
        documentId:
          type: string
          minLength: 1
        revision:
          type: string
          minLength: 1
        startupAt:
          "$ref": "#/components/schemas/Timestamp"
        reloadPolicy:
          type: string
          enum:
          - restart_required
    Coverage:
      type: object
      additionalProperties: false
      required:
      - completeness
      - observedAt
      properties:
        sourceId:
          "$ref": "#/components/schemas/Id"
        connectionId:
          "$ref": "#/components/schemas/ConfigId"
        rootId:
          "$ref": "#/components/schemas/ConfigId"
        completeness:
          type: string
          enum:
          - complete
          - partial
          - unknown
        reasonCodes:
          type: array
          items:
            type: string
        observedCount:
          type: integer
          minimum: 0
        snapshotRevision:
          type: string
        startedAt:
          "$ref": "#/components/schemas/Timestamp"
        completedAt:
          "$ref": "#/components/schemas/Timestamp"
        observedAt:
          "$ref": "#/components/schemas/Timestamp"
    Page:
      type: object
      additionalProperties: false
      required:
      - nextCursor
      - coverage
      - observedAt
      properties:
        nextCursor:
          type: string
          nullable: true
        coverage:
          type: array
          items:
            "$ref": "#/components/schemas/Coverage"
        observedAt:
          "$ref": "#/components/schemas/Timestamp"
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - requestId
      - retryable
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
        requestId:
          type: string
        resourceId:
          "$ref": "#/components/schemas/Id"
        fieldErrors:
          type: array
          items:
            "$ref": "#/components/schemas/FieldError"
        retryable:
          type: boolean
        nextAction:
          type: string
    FieldError:
      type: object
      additionalProperties: false
      required:
      - field
      - code
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    CredentialInput:
      oneOf:
      - "$ref": "#/components/schemas/ApiKeyCredential"
      - "$ref": "#/components/schemas/UsernamePasswordCredential"
      - "$ref": "#/components/schemas/TokenCredential"
      discriminator:
        propertyName: kind
        mapping:
          api_key: "#/components/schemas/ApiKeyCredential"
          username_password: "#/components/schemas/UsernamePasswordCredential"
          token: "#/components/schemas/TokenCredential"
    ApiKeyCredential:
      type: object
      additionalProperties: false
      required:
      - kind
      - apiKey
      properties:
        kind:
          type: string
          enum:
          - api_key
        apiKey:
          type: string
          minLength: 1
          writeOnly: true
    UsernamePasswordCredential:
      type: object
      additionalProperties: false
      required:
      - kind
      - username
      - password
      properties:
        kind:
          type: string
          enum:
          - username_password
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          writeOnly: true
    TokenCredential:
      type: object
      additionalProperties: false
      required:
      - kind
      - token
      properties:
        kind:
          type: string
          enum:
          - token
        token:
          type: string
          minLength: 1
          writeOnly: true
    Connection:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - label
      - endpoint
      - source
      - revision
      - health
      - credentialState
      properties:
        id:
          "$ref": "#/components/schemas/ConfigId"
        kind:
          type: string
          enum:
          - qbittorrent
          - nzbget
          - radarr
          - sonarr
          - jellyfin
          - seerr
        label:
          type: string
        endpoint:
          type: string
          format: uri-reference
        source:
          "$ref": "#/components/schemas/SourceMetadata"
        revision:
          type: string
        health:
          type: string
          enum:
          - healthy
          - degraded
          - unavailable
          - unknown
        observedVersion:
          type: string
        capabilities:
          type: array
          items:
            type: string
        credentialState:
          type: string
          enum:
          - managed
          - missing
          - invalid
          - static_reference
        retiredAt:
          "$ref": "#/components/schemas/Timestamp"
    ConnectionCreate:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - label
      - endpoint
      properties:
        id:
          "$ref": "#/components/schemas/ConfigId"
        kind:
          type: string
          enum:
          - qbittorrent
          - nzbget
          - radarr
          - sonarr
          - jellyfin
          - seerr
        label:
          type: string
          minLength: 1
        endpoint:
          type: string
          format: uri-reference
        credentials:
          "$ref": "#/components/schemas/CredentialInput"
    ConnectionPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        label:
          type: string
          minLength: 1
        endpoint:
          type: string
          format: uri-reference
        credentials:
          "$ref": "#/components/schemas/CredentialInput"
    ConnectionList:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Connection"
        page:
          "$ref": "#/components/schemas/Page"
    ConnectionCheckCreate:
      type: object
      additionalProperties: false
      required:
      - connectionId
      properties:
        connectionId:
          "$ref": "#/components/schemas/ConfigId"
    ConnectionCheck:
      type: object
      additionalProperties: false
      required:
      - id
      - connectionId
      - state
      - createdAt
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        connectionId:
          "$ref": "#/components/schemas/ConfigId"
        state:
          "$ref": "#/components/schemas/CheckState"
        createdAt:
          "$ref": "#/components/schemas/Timestamp"
        completedAt:
          "$ref": "#/components/schemas/Timestamp"
        capabilities:
          type: array
          items:
            type: string
        sanitizedError:
          type: string
    ConnectionCheckList:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/ConnectionCheck"
        page:
          "$ref": "#/components/schemas/Page"
    StoragePurpose:
      type: string
      enum:
      - download
      - library
      - descriptor
      - trash
    WatchSettings:
      type: object
      additionalProperties: false
      required:
      - enabled
      - intervalSeconds
      properties:
        enabled:
          type: boolean
        intervalSeconds:
          type: integer
          minimum: 1
    StorageRoot:
      type: object
      additionalProperties: false
      required:
      - id
      - label
      - purpose
      - path
      - source
      - revision
      - capabilities
      - watch
      properties:
        id:
          "$ref": "#/components/schemas/ConfigId"
        label:
          type: string
        purpose:
          "$ref": "#/components/schemas/StoragePurpose"
        path:
          type: string
          minLength: 1
          description: Effective host path for this root. The server never accepts
            this value in an action target.
        source:
          "$ref": "#/components/schemas/SourceMetadata"
        revision:
          type: string
        capabilities:
          type: array
          items:
            type: string
        permission:
          type: string
          enum:
          - read_only
          - read_write
          - unavailable
          - unknown
        watch:
          "$ref": "#/components/schemas/WatchSettings"
        retiredAt:
          "$ref": "#/components/schemas/Timestamp"
    StorageRootCreate:
      type: object
      additionalProperties: false
      required:
      - id
      - label
      - purpose
      - path
      properties:
        id:
          "$ref": "#/components/schemas/ConfigId"
        label:
          type: string
          minLength: 1
        purpose:
          "$ref": "#/components/schemas/StoragePurpose"
        path:
          type: string
          minLength: 1
          description: Host path accepted only at the configuration boundary.
    StorageRootPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        label:
          type: string
          minLength: 1
        path:
          type: string
          minLength: 1
        watchEnabled:
          type: boolean
        watchIntervalSeconds:
          type: integer
          minimum: 1
    StorageRootList:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/StorageRoot"
        page:
          "$ref": "#/components/schemas/Page"
    PathMapping:
      type: object
      additionalProperties: false
      required:
      - id
      - connectionId
      - sourcePrefix
      - rootId
      - destinationPrefix
      - source
      - revision
      properties:
        id:
          "$ref": "#/components/schemas/ConfigId"
        connectionId:
          "$ref": "#/components/schemas/ConfigId"
        sourcePrefix:
          type: string
        rootId:
          "$ref": "#/components/schemas/ConfigId"
        destinationPrefix:
          type: string
        source:
          "$ref": "#/components/schemas/SourceMetadata"
        revision:
          type: string
    PathMappingCreate:
      type: object
      additionalProperties: false
      required:
      - id
      - connectionId
      - sourcePrefix
      - rootId
      - destinationPrefix
      properties:
        id:
          "$ref": "#/components/schemas/ConfigId"
        connectionId:
          "$ref": "#/components/schemas/ConfigId"
        sourcePrefix:
          type: string
        rootId:
          "$ref": "#/components/schemas/ConfigId"
        destinationPrefix:
          type: string
    PathMappingPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        sourcePrefix:
          type: string
        destinationPrefix:
          type: string
    PathMappingList:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/PathMapping"
        page:
          "$ref": "#/components/schemas/Page"
    Configuration:
      type: object
      additionalProperties: false
      required:
      - source
      - connections
      - storageRoots
      - pathMappings
      - keySource
      properties:
        source:
          "$ref": "#/components/schemas/SourceMetadata"
        connections:
          type: array
          items:
            "$ref": "#/components/schemas/Connection"
        storageRoots:
          type: array
          items:
            "$ref": "#/components/schemas/StorageRoot"
        pathMappings:
          type: array
          items:
            "$ref": "#/components/schemas/PathMapping"
        keySource:
          type: string
          enum:
          - environment
          - secret_file
          - generated_persistent
        keyPath:
          type: string
        restartRequired:
          type: boolean
    ScanCreate:
      type: object
      additionalProperties: false
      required:
      - scope
      properties:
        scope:
          type: string
          enum:
          - roots
          - download_clients
          - catalogs
          - all
        rootIds:
          type: array
          items:
            "$ref": "#/components/schemas/ConfigId"
        connectionIds:
          type: array
          items:
            "$ref": "#/components/schemas/ConfigId"
    Scan:
      type: object
      additionalProperties: false
      required:
      - id
      - scope
      - state
      - coverage
      - createdAt
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        scope:
          type: string
        state:
          "$ref": "#/components/schemas/ScanState"
        coverage:
          type: array
          items:
            "$ref": "#/components/schemas/Coverage"
        createdAt:
          "$ref": "#/components/schemas/Timestamp"
        completedAt:
          "$ref": "#/components/schemas/Timestamp"
        cancellation:
          "$ref": "#/components/schemas/Cancellation"
    ScanList:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Scan"
        page:
          "$ref": "#/components/schemas/Page"
    FileTarget:
      type: object
      additionalProperties: false
      required:
      - rootId
      - relativePath
      properties:
        rootId:
          "$ref": "#/components/schemas/ConfigId"
        relativePath:
          type: string
          minLength: 1
          pattern: "^[^/\\x00].*$"
          description: Root-relative path. The server rejects dot-dot components,
            root targets and symlink escapes.
    FileManifestEntry:
      type: object
      additionalProperties: false
      required:
      - rootId
      - relativePath
      - type
      - size
      properties:
        rootId:
          "$ref": "#/components/schemas/ConfigId"
        relativePath:
          type: string
          minLength: 1
          pattern: "^[^/\\x00].*$"
          description: Root-relative path. The server rejects dot-dot components,
            root targets and symlink escapes.
        type:
          type: string
          enum:
          - file
          - directory
          - subtitle
          - companion
        size:
          type: integer
          minimum: 0
        digest:
          type: string
        fileIdentity:
          type: string
        role:
          type: string
          enum:
          - video
          - subtitle
          - companion
        observedAt:
          "$ref": "#/components/schemas/Timestamp"
    TrackingObservation:
      type: object
      additionalProperties: false
      required:
      - connectionId
      - dimension
      - value
      - observedAt
      properties:
        connectionId:
          "$ref": "#/components/schemas/ConfigId"
        dimension:
          type: string
          enum:
          - registration
          - import
          - availability
          - request
        value:
          type: string
          enum:
          - present
          - absent
          - unknown
        externalId:
          type: string
        providerId:
          type: string
        observedAt:
          "$ref": "#/components/schemas/Timestamp"
        coverageId:
          "$ref": "#/components/schemas/Id"
        evidence:
          type: array
          items:
            type: string
    Provenance:
      type: object
      additionalProperties: false
      properties:
        connectionId:
          "$ref": "#/components/schemas/ConfigId"
        clientItemId:
          type: string
        hash:
          type: string
        completedAt:
          "$ref": "#/components/schemas/Timestamp"
        descriptorId:
          "$ref": "#/components/schemas/Id"
        sourcePath:
          "$ref": "#/components/schemas/FileTarget"
    Discovery:
      type: object
      additionalProperties: false
      required:
      - id
      - files
      - readiness
      - observedAt
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        files:
          type: array
          items:
            "$ref": "#/components/schemas/FileManifestEntry"
        readiness:
          type: string
          enum:
          - ready
          - downloading
          - processing
          - changing
          - unsupported
          - unknown
        provenance:
          type: array
          items:
            "$ref": "#/components/schemas/Provenance"
        candidates:
          type: array
          items:
            "$ref": "#/components/schemas/MetadataCandidate"
        observedAt:
          "$ref": "#/components/schemas/Timestamp"
        coverage:
          "$ref": "#/components/schemas/Coverage"
    DiscoveryList:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Discovery"
        page:
          "$ref": "#/components/schemas/Page"
    Media:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - providerId
      - tracking
      - observedAt
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        kind:
          "$ref": "#/components/schemas/MediaKind"
        providerId:
          type: string
        title:
          type: string
        tracking:
          type: array
          items:
            "$ref": "#/components/schemas/TrackingObservation"
        discoveryIds:
          type: array
          items:
            "$ref": "#/components/schemas/Id"
        observedAt:
          "$ref": "#/components/schemas/Timestamp"
    MediaList:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Media"
        page:
          "$ref": "#/components/schemas/Page"
    Download:
      type: object
      additionalProperties: false
      required:
      - id
      - connectionId
      - state
      - observedAt
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        connectionId:
          "$ref": "#/components/schemas/ConfigId"
        state:
          type: string
          enum:
          - queued
          - downloading
          - seeding
          - complete
          - processing
          - failed
          - unknown
        clientItemId:
          type: string
        hash:
          type: string
        nzbId:
          type: string
        deprecatedId:
          type: string
        descriptorId:
          "$ref": "#/components/schemas/Id"
        completedAt:
          "$ref": "#/components/schemas/Timestamp"
        sourcePath:
          "$ref": "#/components/schemas/FileTarget"
        observedAt:
          "$ref": "#/components/schemas/Timestamp"
        coverage:
          "$ref": "#/components/schemas/Coverage"
    DownloadList:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Download"
        page:
          "$ref": "#/components/schemas/Page"
    MetadataCandidate:
      type: object
      additionalProperties: false
      required:
      - kind
      - title
      properties:
        kind:
          "$ref": "#/components/schemas/MediaKind"
        title:
          type: string
        providerId:
          type: string
        externalId:
          type: string
        year:
          type: integer
        season:
          type: integer
        episodes:
          type: array
          items:
            type: integer
        score:
          type: number
          format: float
    MetadataCandidateList:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/MetadataCandidate"
        page:
          "$ref": "#/components/schemas/Page"
    ConnectionOptions:
      type: object
      additionalProperties: false
      required:
      - connectionId
      - observedAt
      - options
      properties:
        connectionId:
          "$ref": "#/components/schemas/ConfigId"
        observedAt:
          "$ref": "#/components/schemas/Timestamp"
        options:
          oneOf:
          - "$ref": "#/components/schemas/ArrOptions"
          - "$ref": "#/components/schemas/DownloadClientOptions"
          - "$ref": "#/components/schemas/JellyfinOptions"
          - "$ref": "#/components/schemas/SeerrOptions"
          discriminator:
            propertyName: kind
            mapping:
              arr: "#/components/schemas/ArrOptions"
              download_client: "#/components/schemas/DownloadClientOptions"
              jellyfin: "#/components/schemas/JellyfinOptions"
              seerr: "#/components/schemas/SeerrOptions"
    OptionItem:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
    ArrOptions:
      type: object
      additionalProperties: false
      required:
      - kind
      - rootFolders
      - qualityProfiles
      - seriesTypes
      - seasons
      - episodes
      properties:
        kind:
          type: string
          enum:
          - arr
        rootFolders:
          type: array
          items:
            type: string
        qualityProfiles:
          type: array
          items:
            "$ref": "#/components/schemas/OptionItem"
        seriesTypes:
          type: array
          items:
            type: string
        seasons:
          type: array
          items:
            type: integer
        episodes:
          type: array
          items:
            type: integer
    DownloadClientOptions:
      type: object
      additionalProperties: false
      required:
      - kind
      - categories
      - tags
      properties:
        kind:
          type: string
          enum:
          - download_client
        categories:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
    JellyfinOptions:
      type: object
      additionalProperties: false
      required:
      - kind
      - libraries
      properties:
        kind:
          type: string
          enum:
          - jellyfin
        libraries:
          type: array
          items:
            "$ref": "#/components/schemas/OptionItem"
    SeerrOptions:
      type: object
      additionalProperties: false
      required:
      - kind
      - statuses
      properties:
        kind:
          type: string
          enum:
          - seerr
        statuses:
          type: array
          items:
            type: string
    ActionPlan:
      type: object
      additionalProperties: false
      required:
      - id
      - revision
      - digest
      - status
      - action
      - desiredState
      - manifest
      - preconditions
      - capabilities
      - requiredApproval
      properties:
        id:
          "$ref": "#/components/schemas/Id"
        revision:
          type: integer
          minimum: 1
        digest:
          type: string
        status:
          type: string
          enum:
          - preparing
          - ready
          - invalid
          - expired
        action:
          "$ref": "#/components/schemas/ActionInput"
        desiredState:
          type: object
          additionalProperties: true
        manifest:
          type: array
          items:
            "$ref": "#/components/schemas/FileManifestEntry"
        preconditions:
          type: array
          items:
            type: string
        connectionRevisions:
          type: object
          additionalProperties:
            type: string
        mappingRevisions:
          type: object
          additionalProperties:
            type: string
        capabilities:
          type: array
          items:
            type: string
        impacts:
          type: array
          items:
            type: string
        conflicts:
          type: array
          items:
            type: string
        blockingIssues:
          type: array
          items:
            type: string
        estimatedBytes:
          type: integer
          minimum: 0
        requiredApproval:
          type: string
          enum:
          - review
          - irreversible
        expiresAt:
          "$ref": "#/components/schemas/Timestamp"
        createdAt:
          "$ref": "#/components/schemas/Timestamp"
    ActionPlanCreate:
      type: object
      additionalProperties: false
      required:
      - action
      properties:
        action:
          "$ref": "#/components/schemas/ActionInput"
        expiresInSeconds:
          type: integer
          minimum: 60
          maximum: 86400
    ActionPlanList:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/ActionPlan"
        page:
          "$ref": "#/components/schemas/Page"
    ReviewDecisionCreate:
      type: object
      additionalProperties: false
      required:
      - planId
      - revision
      - digest
      - decision
      properties:
        planId:
          "$ref": "#/components/schemas/Id"
        revision:
