    license:
        name: MIT
        url: https://opensource.org/license/mit/
    title: Mastarr API
    version: 0.0.1
openapi: 3.1.1
paths:
    /api/v1/action-plans:
        get:
            operationId: listActionPlans
            parameters:
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ActionPlanList'
                    description: Immutable action plan revisions.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                "409":
                    $ref: '#/components/responses/ProblemSnapshotExpired'
            tags:
                - plans
        post:
            operationId: createActionPlan
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ActionPlanCreate'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ActionPlan'
                    description: Immutable read-only plan created.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                        Location:
                            $ref: '#/components/headers/Location'
                "400":
                    $ref: '#/components/responses/Problem400'
                "409":
                    $ref: '#/components/responses/Problem409'
                "413":
                    $ref: '#/components/responses/Problem413'
                "422":
                    $ref: '#/components/responses/Problem422'
                "429":
                    $ref: '#/components/responses/Problem429'
            tags:
                - plans
    /api/v1/action-plans/{actionPlanId}:
        get:
            operationId: getActionPlan
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ActionPlan'
                    description: Immutable action plan.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                "404":
                    $ref: '#/components/responses/Problem404'
            tags:
                - plans
        parameters:
            - $ref: '#/components/parameters/ActionPlanId'
    /api/v1/action-plans/{actionPlanId}/revisions:
        parameters:
            - $ref: '#/components/parameters/ActionPlanId'
        post:
            operationId: createActionPlanRevision
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ActionPlanCreate'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ActionPlan'
                    description: New immutable plan revision.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                        Location:
                            $ref: '#/components/headers/Location'
                "404":
                    $ref: '#/components/responses/Problem404'
                "409":
                    $ref: '#/components/responses/Problem409'
                "422":
                    $ref: '#/components/responses/Problem422'
                "429":
                    $ref: '#/components/responses/Problem429'
            tags:
                - plans
    /api/v1/action-runs:
        get:
            operationId: listActionRuns
            parameters:
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ActionRunList'
                    description: Durable action runs.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                "409":
                    $ref: '#/components/responses/ProblemSnapshotExpired'
            tags:
                - execution
    /api/v1/action-runs/{actionRunId}:
        get:
            operationId: getActionRun
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ActionRun'
                    description: Action state, effects and unresolved observations.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                "404":
                    $ref: '#/components/responses/Problem404'
            tags:
                - execution
        parameters:
            - $ref: '#/components/parameters/ActionRunId'
    /api/v1/action-runs/{actionRunId}/attempts:
        get:
            operationId: listActionAttempts
            parameters:
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AttemptList'
                    description: Sanitized attempt journal.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                "404":
                    $ref: '#/components/responses/Problem404'
                "409":
                    $ref: '#/components/responses/ProblemSnapshotExpired'
            tags:
                - execution
        parameters:
            - $ref: '#/components/parameters/ActionRunId'
    /api/v1/action-runs/{actionRunId}/cancellations:
        parameters:
            - $ref: '#/components/parameters/ActionRunId'
        post:
            operationId: cancelActionRun
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CancellationCreate'
                required: false
            responses:
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Cancellation'
                    description: Durable cancellation request.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                        Location:
                            $ref: '#/components/headers/Location'
                "404":
                    $ref: '#/components/responses/Problem404'
                "409":
                    $ref: '#/components/responses/Problem409'
                "429":
                    $ref: '#/components/responses/Problem429'
            tags:
                - execution
    /api/v1/action-runs/{actionRunId}/reconciliations:
        parameters:
            - $ref: '#/components/parameters/ActionRunId'
        post:
            operationId: requestActionReconciliation
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReconciliationRequest'
                required: false
            responses:
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AsyncAccepted'
                    description: Read-only reconciliation queued.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                        Location:
                            $ref: '#/components/headers/Location'
                "404":
                    $ref: '#/components/responses/Problem404'
                "409":
                    $ref: '#/components/responses/Problem409'
                "429":
                    $ref: '#/components/responses/Problem429'
            tags:
                - execution
    /api/v1/action-runs/{actionRunId}/retry-requests:
        parameters:
            - $ref: '#/components/parameters/ActionRunId'
        post:
            operationId: requestActionRetry
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RetryRequest'
                required: true
            responses:
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AsyncAccepted'
                    description: Explicit retry request queued after validation.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                        Location:
                            $ref: '#/components/headers/Location'
                "404":
                    $ref: '#/components/responses/Problem404'
                "409":
                    $ref: '#/components/responses/Problem409'
                "429":
                    $ref: '#/components/responses/Problem429'
            tags:
                - execution
    /api/v1/audit-events:
        get:
            operationId: listAuditEvents
            parameters:
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuditEventList'
                    description: Cursor-paginated audit events.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                "409":
                    $ref: '#/components/responses/ProblemSnapshotExpired'
            tags:
                - audit
    /api/v1/configuration:
        get:
            operationId: getConfiguration
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Configuration'
                    description: Effective non-secret configuration.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                        ETag:
                            $ref: '#/components/headers/ETag'
            tags:
                - configuration
    /api/v1/connection-checks:
        get:
            operationId: listConnectionChecks
            parameters:
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ConnectionCheckList'
                    description: Connection checks.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                "409":
                    $ref: '#/components/responses/ProblemSnapshotExpired'
            tags:
                - observations
        post:
            operationId: createConnectionCheck
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ConnectionCheckCreate'
                required: true
            responses:
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AsyncAccepted'
                    description: Check queued.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                        Location:
                            $ref: '#/components/headers/Location'
                "400":
                    $ref: '#/components/responses/Problem400'
                "404":
                    $ref: '#/components/responses/Problem404'
                "409":
                    $ref: '#/components/responses/Problem409'
                "429":
                    $ref: '#/components/responses/Problem429'
                "503":
                    $ref: '#/components/responses/Problem503'
            tags:
                - observations
    /api/v1/connection-checks/{connectionCheckId}:
        get:
            operationId: getConnectionCheck
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ConnectionCheck'
                    description: Connection check result.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                "404":
                    $ref: '#/components/responses/Problem404'
            tags:
                - observations
        parameters:
            - $ref: '#/components/parameters/ConnectionCheckId'
    /api/v1/connections:
        get:
            operationId: listConnections
            parameters:
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ConnectionList'
                    description: Configured integration connections.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                "409":
                    $ref: '#/components/responses/ProblemSnapshotExpired'
            tags:
                - configuration
        post:
            operationId: createConnection
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ConnectionCreate'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Connection'
                    description: Managed connection created.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                        ETag:
                            $ref: '#/components/headers/ETag'
                        Location:
                            $ref: '#/components/headers/Location'
                "400":
                    $ref: '#/components/responses/Problem400'
                "409":
                    $ref: '#/components/responses/Problem409'
                "422":
                    $ref: '#/components/responses/Problem422'
                "429":
                    $ref: '#/components/responses/Problem429'
            tags:
                - configuration
    /api/v1/connections/{connectionId}:
        delete:
            operationId: retireConnection
            parameters:
                - $ref: '#/components/parameters/IfMatch'
                - $ref: '#/components/parameters/IdempotencyKey'
            responses:
                "204":
                    description: Connection retired.
                "404":
                    $ref: '#/components/responses/Problem404'
                "409":
                    $ref: '#/components/responses/Problem409'
                "412":
                    $ref: '#/components/responses/Problem412'
                "428":
                    $ref: '#/components/responses/Problem428'
            tags:
                - configuration
        get:
            operationId: getConnection
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Connection'
                    description: Managed connection.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                        ETag:
                            $ref: '#/components/headers/ETag'
                "404":
                    $ref: '#/components/responses/Problem404'
            tags:
                - configuration
        parameters:
            - $ref: '#/components/parameters/ConnectionId'
        patch:
            operationId: patchConnection
            parameters:
                - $ref: '#/components/parameters/IfMatch'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ConnectionPatch'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Connection'
                    description: Updated managed connection.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                        ETag:
                            $ref: '#/components/headers/ETag'
                "400":
                    $ref: '#/components/responses/Problem400'
                "404":
                    $ref: '#/components/responses/Problem404'
                "409":
                    $ref: '#/components/responses/Problem409'
                "412":
                    $ref: '#/components/responses/Problem412'
                "428":
                    $ref: '#/components/responses/Problem428'
            tags:
                - configuration
    /api/v1/connections/{connectionId}/options:
        get:
            operationId: getConnectionOptions
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ConnectionOptions'
                    description: Current typed options for a selected upstream.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                "404":
                    $ref: '#/components/responses/Problem404'
                "503":
                    $ref: '#/components/responses/Problem503'
            tags:
                - observations
        parameters:
            - $ref: '#/components/parameters/ConnectionId'
    /api/v1/descriptors:
        get:
            operationId: listDescriptors
            parameters:
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DescriptorList'
                    description: Descriptor metadata.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                "409":
                    $ref: '#/components/responses/ProblemSnapshotExpired'
            tags:
                - observations
    /api/v1/descriptors/{descriptorId}:
        get:
            operationId: getDescriptor
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Descriptor'
                    description: Descriptor metadata without content.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                "404":
                    $ref: '#/components/responses/Problem404'
            tags:
                - observations
        parameters:
            - $ref: '#/components/parameters/DescriptorId'
    /api/v1/descriptors/{descriptorId}/content:
        get:
            operationId: getDescriptorContent
            responses:
                "200":
                    content:
                        application/octet-stream:
                            schema:
                                format: binary
                                type: string
                    description: Original descriptor bytes.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                        Content-Disposition:
                            schema:
                                type: string
                        X-Content-Type-Options:
                            schema:
                                enum:
                                    - nosniff
                                type: string
                "404":
                    $ref: '#/components/responses/Problem404'
            tags:
                - observations
        parameters:
            - $ref: '#/components/parameters/DescriptorId'
    /api/v1/discoveries:
        get:
            operationId: listDiscoveries
            parameters:
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
                - $ref: '#/components/parameters/RootFilter'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DiscoveryList'
                    description: Observed file groups.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                "409":
                    $ref: '#/components/responses/ProblemSnapshotExpired'
            tags:
                - observations
    /api/v1/discoveries/{discoveryId}:
        get:
            operationId: getDiscovery
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Discovery'
                    description: Discovery with provenance and candidates.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                "404":
                    $ref: '#/components/responses/Problem404'
            tags:
                - observations
        parameters:
            - $ref: '#/components/parameters/DiscoveryId'
    /api/v1/downloads:
        get:
            operationId: listDownloads
            parameters:
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
                - $ref: '#/components/parameters/ConnectionFilter'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DownloadList'
                    description: Download-client observations.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                "409":
                    $ref: '#/components/responses/ProblemSnapshotExpired'
            tags:
                - observations
    /api/v1/downloads/{downloadId}:
        get:
            operationId: getDownload
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Download'
                    description: Download provenance and descriptor links.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                "404":
                    $ref: '#/components/responses/Problem404'
            tags:
                - observations
        parameters:
            - $ref: '#/components/parameters/DownloadId'
    /api/v1/media:
        get:
            operationId: listMedia
            parameters:
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
                - $ref: '#/components/parameters/MediaKindFilter'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MediaList'
                    description: Aggregated media identities and tracking observations.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                "409":
                    $ref: '#/components/responses/ProblemSnapshotExpired'
            tags:
                - observations
    /api/v1/media/{mediaId}:
        get:
            operationId: getMedia
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Media'
                    description: Media identity and all instance observations.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                "404":
                    $ref: '#/components/responses/Problem404'
            tags:
                - observations
        parameters:
            - $ref: '#/components/parameters/MediaId'
    /api/v1/metadata-candidates:
        get:
            operationId: listMetadataCandidates
            parameters:
                - in: query
                  name: connectionId
                  required: true
                  schema:
                    $ref: '#/components/schemas/ConfigId'
                - in: query
                  name: kind
                  required: true
                  schema:
                    $ref: '#/components/schemas/MediaKind'
                - in: query
                  name: query
                  required: true
                  schema:
                    minLength: 1
                    type: string
                - $ref: '#/components/parameters/Limit'
                - $ref: '#/components/parameters/Cursor'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MetadataCandidateList'
                    description: Suggestions from a selected Arr instance.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                "400":
                    $ref: '#/components/responses/Problem400'
                "404":
                    $ref: '#/components/responses/Problem404'
                "409":
                    $ref: '#/components/responses/ProblemSnapshotExpired'
                "503":
                    $ref: '#/components/responses/Problem503'
            tags:
                - observations
    /api/v1/path-mappings:
        get:
            operationId: listPathMappings
            parameters:
                - $ref: '#/components/parameters/Cursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PathMappingList'
                    description: Explicit upstream path mappings.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                "409":
                    $ref: '#/components/responses/ProblemSnapshotExpired'
            tags:
                - configuration
        post:
            operationId: createPathMapping
            parameters:
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PathMappingCreate'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PathMapping'
                    description: Path mapping created.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                        ETag:
                            $ref: '#/components/headers/ETag'
                        Location:
                            $ref: '#/components/headers/Location'
                "400":
                    $ref: '#/components/responses/Problem400'
                "409":
                    $ref: '#/components/responses/Problem409'
                "422":
                    $ref: '#/components/responses/Problem422'
                "429":
                    $ref: '#/components/responses/Problem429'
            tags:
                - configuration
    /api/v1/path-mappings/{pathMappingId}:
        delete:
            operationId: retirePathMapping
            parameters:
                - $ref: '#/components/parameters/IfMatch'
                - $ref: '#/components/parameters/IdempotencyKey'
            responses:
                "204":
                    description: Path mapping retired.
                "404":
                    $ref: '#/components/responses/Problem404'
                "409":
                    $ref: '#/components/responses/Problem409'
                "412":
                    $ref: '#/components/responses/Problem412'
                "428":
                    $ref: '#/components/responses/Problem428'
            tags:
                - configuration
        get:
            operationId: getPathMapping
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PathMapping'
                    description: Path mapping.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                        ETag:
                            $ref: '#/components/headers/ETag'
                "404":
                    $ref: '#/components/responses/Problem404'
            tags:
                - configuration
        parameters:
            - $ref: '#/components/parameters/PathMappingId'
        patch:
            operationId: patchPathMapping
            parameters:
                - $ref: '#/components/parameters/IfMatch'
                - $ref: '#/components/parameters/IdempotencyKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PathMappingPatch'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PathMapping'
                    description: Updated path mapping.
                    headers:
                        Cache-Control:
                            $ref: '#/components/headers/Cache-Control'
                        ETag:
                            $ref: '#/components/headers/ETag'
                "400":
                    $ref: '#/components/responses/Problem400'
                "404":
                    $ref: '#/components/responses/Problem404'
                "409":
                    $ref: '#/components/responses/Problem409'
                "412":
                    $ref: '#/components/responses/Problem412'
                "428":
                    $ref: '#/components/responses/Problem428'
            tags:
                - configuration
