        '409':
          $ref: '#/components/responses/ProblemSnapshotExpired'

components:
  headers:
    Location:
      description: URL of the created resource.
      schema:
        type: string
        format: uri-reference
    ETag:
      description: Opaque application revision tag.
      schema:
        type: string
        minLength: 1
    Cache-Control:
      description: Responses containing inventory, credentials metadata, actions or descriptor bytes are never cached.
      schema:
        type: string
        enum: [no-store]
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ConfigId'
    ConnectionCheckId:
      name: connectionCheckId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    StorageRootId:
      name: storageRootId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ConfigId'
    PathMappingId:
      name: pathMappingId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ConfigId'
    ScanId:
      name: scanId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    DiscoveryId:
      name: discoveryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    DownloadId:
      name: downloadId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ActionPlanId:
      name: actionPlanId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ReviewDecisionId:
      name: reviewDecisionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ActionRunId:
      name: actionRunId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    WorkflowRunId:
      name: workflowRunId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    TrashId:
      name: trashId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    DescriptorId:
      name: descriptorId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    RootFilter:
      name: rootId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ConfigId'
    MediaKindFilter:
      name: kind
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/MediaKind'
    ConnectionFilter:
      name: connectionId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ConfigId'
  responses:
    Problem400:
      description: Invalid request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem404:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem409:
      description: State, plan or idempotency conflict.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem428:
      description: Required If-Match precondition was not supplied.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProblemSnapshotExpired:
      description: Cursor snapshot has expired and must be restarted.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem412:
      description: Required revision precondition failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem413:
      description: Request or manifest is too large.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem422:
      description: Requested capability or mapping is unsafe or unsupported.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem429:
      description: Local capacity limit reached.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem503:
      description: Dependency or readiness unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Id:
      $ref: '#/components/schemas/RuntimeId'
    RuntimeId:
      type: string
      format: uuid
    ConfigId:
      type: string
      minLength: 1
      maxLength: 63
      pattern: '^[a-z0-9](?:[a-z0-9._-]*[a-z0-9])?$'
    Timestamp:
      type: string
      format: date-time
    MediaKind:
      type: string
      enum: [movie, episode, season, anime]
    Health:
      type: object
      additionalProperties: false
      required: [status, observedAt]
      properties:
        status:
          type: string
          enum: [ok, degraded, not_ready]
        observedAt:
          $ref: '#/components/schemas/Timestamp'
        reason:
          type: string
    SourceMetadata:
      type: object
      additionalProperties: false
      required: [source, editable, documentId, revision, startupAt, reloadPolicy]
      properties:
        source:
          type: string
          enum: [yaml, api]
        editable:
          type: boolean
        documentId:
          type: string
          minLength: 1
        revision:
          type: string
          minLength: 1
        startupAt:
          $ref: '#/components/schemas/Timestamp'
        reloadPolicy:
          type: string
          enum: [restart_required]
    Coverage:
      type: object
      additionalProperties: false
      required: [completeness, observedAt]
      properties:
        sourceId:
          $ref: '#/components/schemas/Id'
        connectionId:
          $ref: '#/components/schemas/ConfigId'
        rootId:
          $ref: '#/components/schemas/ConfigId'
        completeness:
          type: string
          enum: [complete, partial, unknown]
        reasonCodes:
          type: array
          items:
            type: string
        observedCount:
          type: integer
          minimum: 0
        snapshotRevision:
          type: string
        startedAt:
          $ref: '#/components/schemas/Timestamp'
        completedAt:
          $ref: '#/components/schemas/Timestamp'
        observedAt:
          $ref: '#/components/schemas/Timestamp'
    Page:
      type: object
      additionalProperties: false
      required: [nextCursor, coverage, observedAt]
      properties:
        nextCursor:
          type: string
          nullable: true
        coverage:
          type: array
          items:
            $ref: '#/components/schemas/Coverage'
        observedAt:
          $ref: '#/components/schemas/Timestamp'
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, requestId, retryable]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
        requestId:
          type: string
        resourceId:
          $ref: '#/components/schemas/Id'
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        retryable:
          type: boolean
        nextAction:
          type: string
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    CredentialInput:
      oneOf:
        - $ref: '#/components/schemas/ApiKeyCredential'
        - $ref: '#/components/schemas/UsernamePasswordCredential'
        - $ref: '#/components/schemas/TokenCredential'
      discriminator:
        propertyName: kind
        mapping:
          api_key: '#/components/schemas/ApiKeyCredential'
          username_password: '#/components/schemas/UsernamePasswordCredential'
          token: '#/components/schemas/TokenCredential'
    ApiKeyCredential:
      type: object
      additionalProperties: false
      required: [kind, apiKey]
      properties:
        kind:
          type: string
          enum: [api_key]
        apiKey:
          type: string
          minLength: 1
          writeOnly: true
    UsernamePasswordCredential:
      type: object
      additionalProperties: false
      required: [kind, username, password]
      properties:
        kind:
          type: string
          enum: [username_password]
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          writeOnly: true
    TokenCredential:
      type: object
      additionalProperties: false
      required: [kind, token]
      properties:
        kind:
          type: string
          enum: [token]
        token:
          type: string
          minLength: 1
          writeOnly: true
    Connection:
      type: object
      additionalProperties: false
      required: [id, kind, label, endpoint, source, revision, health, credentialState]
      properties:
        id:
          $ref: '#/components/schemas/ConfigId'
        kind:
          type: string
          enum: [qbittorrent, nzbget, radarr, sonarr, jellyfin, seerr]
        label:
          type: string
        endpoint:
          type: string
          format: uri-reference
        source:
          $ref: '#/components/schemas/SourceMetadata'
        revision:
          type: string
        health:
          type: string
          enum: [healthy, degraded, unavailable, unknown]
        observedVersion:
          type: string
        capabilities:
          type: array
          items:
            type: string
        credentialState:
          type: string
          enum: [managed, missing, invalid, static_reference]
        retiredAt:
          $ref: '#/components/schemas/Timestamp'
    ConnectionCreate:
      type: object
      additionalProperties: false
      required: [id, kind, label, endpoint]
      properties:
        id:
          $ref: '#/components/schemas/ConfigId'
        kind:
          type: string
          enum: [qbittorrent, nzbget, radarr, sonarr, jellyfin, seerr]
        label:
          type: string
          minLength: 1
        endpoint:
          type: string
          format: uri-reference
        credentials:
          $ref: '#/components/schemas/CredentialInput'
    ConnectionPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        label:
          type: string
          minLength: 1
        endpoint:
          type: string
          format: uri-reference
        credentials:
          $ref: '#/components/schemas/CredentialInput'
    ConnectionList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Connection'
        page:
          $ref: '#/components/schemas/Page'
    ConnectionCheckCreate:
      type: object
      additionalProperties: false
      required: [connectionId]
      properties:
        connectionId:
          $ref: '#/components/schemas/ConfigId'
    ConnectionCheck:
      type: object
      additionalProperties: false
      required: [id, connectionId, state, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        connectionId:
          $ref: '#/components/schemas/ConfigId'
        state:
          $ref: '#/components/schemas/CheckState'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        completedAt:
          $ref: '#/components/schemas/Timestamp'
        capabilities:
          type: array
          items:
            type: string
        sanitizedError:
          type: string
    ConnectionCheckList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionCheck'
        page:
          $ref: '#/components/schemas/Page'
    StoragePurpose:
      type: string
      enum: [download, library, descriptor, trash]
    WatchSettings:
      type: object
      additionalProperties: false
      required: [enabled, intervalSeconds]
      properties:
        enabled:
          type: boolean
        intervalSeconds:
          type: integer
          minimum: 1
    StorageRoot:
      type: object
      additionalProperties: false
      required: [id, label, purpose, path, source, revision, capabilities, watch]
      properties:
        id:
          $ref: '#/components/schemas/ConfigId'
        label:
          type: string
        purpose:
          $ref: '#/components/schemas/StoragePurpose'
        path:
          type: string
          minLength: 1
          description: Effective host path for this root. The server never accepts this value in an action target.
        source:
          $ref: '#/components/schemas/SourceMetadata'
        revision:
          type: string
        capabilities:
          type: array
          items:
            type: string
        permission:
          type: string
