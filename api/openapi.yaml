openapi: 3.0.3
info:
  title: Managerr API
  version: 0.0.1
  license:
    name: MIT
    url: https://opensource.org/license/mit/
  description: >-
    Contract-first API for reviewing downloaded media and reconciling it with
    configured Arr, download-client, Jellyfin, Seerr and filesystem state.
servers:
  - url: /
tags:
  - name: health
  - name: configuration
  - name: observations
  - name: plans
  - name: execution
  - name: trash
  - name: audit
paths:
  /health/live:
    get:
      operationId: getLiveHealth
      tags: [health]
      responses:
        '200':
          description: Process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      operationId: getReadyHealth
      tags: [health]
      responses:
        '200':
          description: Database, migrations and key are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Problem503'

  /api/v1/connections:
    get:
      operationId: listConnections
      tags: [configuration]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Configured integration connections.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionList'
        '409':
          $ref: '#/components/responses/ProblemSnapshotExpired'
    post:
      operationId: createConnection
      tags: [configuration]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionCreate'
      responses:
        '201':
          description: Managed connection created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '400':
          $ref: '#/components/responses/Problem400'
        '409':
          $ref: '#/components/responses/Problem409'
        '429':
          $ref: '#/components/responses/Problem429'
        '422':
          $ref: '#/components/responses/Problem422'
  /api/v1/connections/{connectionId}:
    parameters:
      - $ref: '#/components/parameters/ConnectionId'
    get:
      operationId: getConnection
      tags: [configuration]
      responses:
        '200':
          description: Managed connection.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '404':
          $ref: '#/components/responses/Problem404'
    patch:
      operationId: patchConnection
      tags: [configuration]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionPatch'
      responses:
        '200':
          description: Updated managed connection.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '400':
          $ref: '#/components/responses/Problem400'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '412':
          $ref: '#/components/responses/Problem412'
        '428':
          $ref: '#/components/responses/Problem428'
    delete:
      operationId: retireConnection
      tags: [configuration]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Connection retired.
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '412':
          $ref: '#/components/responses/Problem412'
        '428':
          $ref: '#/components/responses/Problem428'

  /api/v1/connection-checks:
    get:
      operationId: listConnectionChecks
      tags: [observations]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Connection checks.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionCheckList'
        '409':
          $ref: '#/components/responses/ProblemSnapshotExpired'
    post:
      operationId: createConnectionCheck
      tags: [observations]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionCheckCreate'
      responses:
        '202':
          description: Check queued.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncAccepted'
        '400':
          $ref: '#/components/responses/Problem400'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '429':
          $ref: '#/components/responses/Problem429'
        '503':
          $ref: '#/components/responses/Problem503'
  /api/v1/connection-checks/{connectionCheckId}:
    parameters:
      - $ref: '#/components/parameters/ConnectionCheckId'
    get:
      operationId: getConnectionCheck
      tags: [observations]
      responses:
        '200':
          description: Connection check result.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionCheck'
        '404':
          $ref: '#/components/responses/Problem404'

  /api/v1/storage-roots:
    get:
      operationId: listStorageRoots
      tags: [configuration]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Configured storage roots.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageRootList'
        '409':
          $ref: '#/components/responses/ProblemSnapshotExpired'
    post:
      operationId: createStorageRoot
      tags: [configuration]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageRootCreate'
      responses:
        '201':
          description: Storage root created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageRoot'
        '400':
          $ref: '#/components/responses/Problem400'
        '409':
          $ref: '#/components/responses/Problem409'
        '429':
          $ref: '#/components/responses/Problem429'
        '422':
          $ref: '#/components/responses/Problem422'
  /api/v1/storage-roots/{storageRootId}:
    parameters:
      - $ref: '#/components/parameters/StorageRootId'
    get:
      operationId: getStorageRoot
      tags: [configuration]
      responses:
        '200':
          description: Storage root.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageRoot'
        '404':
          $ref: '#/components/responses/Problem404'
    patch:
      operationId: patchStorageRoot
      tags: [configuration]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageRootPatch'
      responses:
        '200':
          description: Updated storage root.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageRoot'
        '400':
          $ref: '#/components/responses/Problem400'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '412':
          $ref: '#/components/responses/Problem412'
        '428':
          $ref: '#/components/responses/Problem428'
    delete:
      operationId: retireStorageRoot
      tags: [configuration]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Storage root retired.
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '412':
          $ref: '#/components/responses/Problem412'
        '428':
          $ref: '#/components/responses/Problem428'

  /api/v1/path-mappings:
    get:
      operationId: listPathMappings
      tags: [configuration]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Explicit upstream path mappings.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathMappingList'
        '409':
          $ref: '#/components/responses/ProblemSnapshotExpired'
    post:
      operationId: createPathMapping
      tags: [configuration]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PathMappingCreate'
      responses:
        '201':
          description: Path mapping created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathMapping'
        '400':
          $ref: '#/components/responses/Problem400'
        '409':
          $ref: '#/components/responses/Problem409'
        '429':
          $ref: '#/components/responses/Problem429'
        '422':
          $ref: '#/components/responses/Problem422'
  /api/v1/path-mappings/{pathMappingId}:
    parameters:
      - $ref: '#/components/parameters/PathMappingId'
    get:
      operationId: getPathMapping
      tags: [configuration]
      responses:
        '200':
          description: Path mapping.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathMapping'
        '404':
          $ref: '#/components/responses/Problem404'
    patch:
      operationId: patchPathMapping
      tags: [configuration]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PathMappingPatch'
      responses:
        '200':
          description: Updated path mapping.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathMapping'
        '400':
          $ref: '#/components/responses/Problem400'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '412':
          $ref: '#/components/responses/Problem412'
        '428':
          $ref: '#/components/responses/Problem428'
    delete:
      operationId: retirePathMapping
      tags: [configuration]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Path mapping retired.
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '412':
          $ref: '#/components/responses/Problem412'
        '428':
          $ref: '#/components/responses/Problem428'

  /api/v1/configuration:
    get:
      operationId: getConfiguration
      tags: [configuration]
      responses:
        '200':
          description: Effective non-secret configuration.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'

  /api/v1/scans:
    get:
      operationId: listScans
      tags: [observations]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Scan jobs.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanList'
        '409':
          $ref: '#/components/responses/ProblemSnapshotExpired'
    post:
      operationId: createScan
      tags: [observations]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanCreate'
      responses:
        '202':
          description: Scan queued or coalesced.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncAccepted'
        '400':
          $ref: '#/components/responses/Problem400'
        '409':
          $ref: '#/components/responses/Problem409'
        '429':
          $ref: '#/components/responses/Problem429'
  /api/v1/scans/{scanId}:
    parameters:
      - $ref: '#/components/parameters/ScanId'
    get:
      operationId: getScan
      tags: [observations]
      responses:
        '200':
          description: Scan progress and coverage.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scan'
        '404':
          $ref: '#/components/responses/Problem404'
  /api/v1/scans/{scanId}/cancellations:
    parameters:
      - $ref: '#/components/parameters/ScanId'
    post:
      operationId: cancelScan
      tags: [execution]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Cancellation requested.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cancellation'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '429':
          $ref: '#/components/responses/Problem429'

  /api/v1/discoveries:
    get:
      operationId: listDiscoveries
      tags: [observations]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RootFilter'
      responses:
        '200':
          description: Observed file groups.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryList'
        '409':
          $ref: '#/components/responses/ProblemSnapshotExpired'
  /api/v1/discoveries/{discoveryId}:
    parameters:
      - $ref: '#/components/parameters/DiscoveryId'
    get:
      operationId: getDiscovery
      tags: [observations]
      responses:
        '200':
          description: Discovery with provenance and candidates.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Discovery'
        '404':
          $ref: '#/components/responses/Problem404'

  /api/v1/media:
    get:
      operationId: listMedia
      tags: [observations]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/MediaKindFilter'
      responses:
        '200':
          description: Aggregated media identities and tracking observations.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaList'
        '409':
          $ref: '#/components/responses/ProblemSnapshotExpired'
  /api/v1/media/{mediaId}:
    parameters:
      - $ref: '#/components/parameters/MediaId'
    get:
      operationId: getMedia
      tags: [observations]
      responses:
        '200':
          description: Media identity and all instance observations.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '404':
          $ref: '#/components/responses/Problem404'

  /api/v1/downloads:
    get:
      operationId: listDownloads
      tags: [observations]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/ConnectionFilter'
      responses:
        '200':
          description: Download-client observations.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadList'
        '409':
          $ref: '#/components/responses/ProblemSnapshotExpired'
  /api/v1/downloads/{downloadId}:
    parameters:
      - $ref: '#/components/parameters/DownloadId'
    get:
      operationId: getDownload
      tags: [observations]
      responses:
        '200':
          description: Download provenance and descriptor links.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Download'
        '404':
          $ref: '#/components/responses/Problem404'

  /api/v1/metadata-candidates:
    get:
      operationId: listMetadataCandidates
      tags: [observations]
      parameters:
        - name: connectionId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ConfigId'
        - name: kind
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/MediaKind'
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Suggestions from a selected Arr instance.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataCandidateList'
        '400':
          $ref: '#/components/responses/Problem400'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/ProblemSnapshotExpired'
        '503':
          $ref: '#/components/responses/Problem503'

  /api/v1/connections/{connectionId}/options:
    parameters:
      - $ref: '#/components/parameters/ConnectionId'
    get:
      operationId: getConnectionOptions
      tags: [observations]
      responses:
        '200':
          description: Current typed options for a selected upstream.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionOptions'
        '404':
          $ref: '#/components/responses/Problem404'
        '503':
          $ref: '#/components/responses/Problem503'

  /api/v1/action-plans:
    get:
      operationId: listActionPlans
      tags: [plans]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Immutable action plan revisions.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionPlanList'
        '409':
          $ref: '#/components/responses/ProblemSnapshotExpired'
    post:
      operationId: createActionPlan
      tags: [plans]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionPlanCreate'
      responses:
        '201':
          description: Immutable read-only plan created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionPlan'
        '400':
          $ref: '#/components/responses/Problem400'
        '409':
          $ref: '#/components/responses/Problem409'
        '413':
          $ref: '#/components/responses/Problem413'
        '429':
          $ref: '#/components/responses/Problem429'
        '422':
          $ref: '#/components/responses/Problem422'
  /api/v1/action-plans/{actionPlanId}:
    parameters:
      - $ref: '#/components/parameters/ActionPlanId'
    get:
      operationId: getActionPlan
      tags: [plans]
      responses:
        '200':
          description: Immutable action plan.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionPlan'
        '404':
          $ref: '#/components/responses/Problem404'
  /api/v1/action-plans/{actionPlanId}/revisions:
    parameters:
      - $ref: '#/components/parameters/ActionPlanId'
    post:
      operationId: createActionPlanRevision
      tags: [plans]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionPlanCreate'
      responses:
        '201':
          description: New immutable plan revision.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionPlan'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '429':
          $ref: '#/components/responses/Problem429'
        '422':
          $ref: '#/components/responses/Problem422'

  /api/v1/review-decisions:
    post:
      operationId: createReviewDecision
      tags: [plans]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecisionCreate'
      responses:
        '202':
          description: Decision recorded and action run queued when approved.
          headers:
