version: "2"

sql:
  - engine: sqlite
    schema:
      - migrations/000001_initial.up.sql
      - migrations/000002_indexes.up.sql
      - migrations/000003_storage_contract.up.sql
      - migrations/000004_storage_compatibility.up.sql
      - migrations/000005_storage_safety.up.sql
      - migrations/000006_approval_safety.up.sql
      - migrations/000007_storage_recovery_safety.up.sql
      - migrations/000008_storage_recovery_concurrency.up.sql
    queries: internal/storage/query.sql
    gen:
      go:
        package: sqlc
        out: internal/storage/sqlc
        sql_package: database/sql
        emit_empty_slices: true
        emit_json_tags: true
        emit_interface: true
        emit_result_struct_pointers: true
        emit_params_struct_pointers: true
